<!DOCTYPE html>
<html lang="en" data-boot-id="{{BOOT_ID}}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coinbox - Starting</title>
  <script>document.documentElement.dataset.pageReady = '0';</script>
  <link rel="stylesheet" href="/glyphs.css">
  <script src="/connection_monitor.js"></script>
  <script src="/glyphs.js"></script>
  <style>
    :root {
      --text: #0f172a;
      --muted: #475569;
      --card: #fff;
      --border: #e5e7eb;
      --accent: #2563eb;
      --accent-2: #1d4ed8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f7fb;
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      min-width: 320px;
      text-align: center;
      position: relative;
      overflow-x: auto;
      isolation: isolate;
    }

    html[data-page-ready="0"] body {
      visibility: hidden;
    }

    .content {
      padding: clamp(1rem, calc(2vw + 0.5rem), 2.5rem);
      max-width: 960px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .card {
      position: relative;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
      padding: 50px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: clamp(1.7rem, calc(1vw + 1.35rem), 2.2rem);
    }

    .card-tools {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      gap: 0.5rem;
    }

    .tool-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #eef2ff;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .tool-btn svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    .tool-btn:hover {
      background: #e0e7ff;
    }

    .tool-btn:active {
      transform: scale(0.98);
    }

    .tool-btn:disabled {
      opacity: 0.65;
      cursor: progress;
    }

    .tool-btn.danger {
      background: #fee2e2;
      color: #991b1b;
      border-color: #fecaca;
    }

    .tool-btn.danger:hover {
      background: #fecaca;
    }

    .tool-btn.warning {
      background: #fef3c7;
      color: #92400e;
      border-color: #fde68a;
    }

    .tool-btn.warning:hover {
      background: #fde68a;
    }

    .status-row {
      display: flex;
      gap: 0.9rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.6rem 0.9rem;
      border-radius: 12px;
      background: #e0e7ff;
      color: var(--accent);
      font-weight: 700;
      min-width: 74px;
      font-size: 1rem;
    }

    .status-text {
      color: var(--muted);
      font-size: 0.98rem;
      white-space: pre-line;
    }

    .status-text.strong {
      font-weight: 700;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 0.15rem;
      justify-content: center;
    }

    .btn {
      text-decoration: none;
      padding: 0.75em 1.2em;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-weight: 700;
      color: var(--text);
      background: #eef2ff;
      min-width: 150px;
      text-align: center;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    }

    .btn:hover {
      background: #e0e7ff;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent-2);
    }

    .btn.primary:hover {
      background: var(--accent-2);
    }

    .note {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.42);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 20;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: min(100%, 420px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.2);
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      text-align: left;
    }

    .modal-card h2 {
      font-size: 1.15rem;
      margin: 0;
    }

    .modal-copy {
      color: var(--muted);
      font-size: 0.94rem;
    }

    .modal-field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .modal-field label {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.92rem;
    }

    .modal-field input {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.72rem 0.78rem;
      font: inherit;
      width: 100%;
      background: #fff;
      color: var(--text);
    }

    .modal-field input.pin-input {
      font-family: "SFMono-Regular","Consolas","Liberation Mono",monospace;
      letter-spacing: 0.08em;
    }

    .modal-error {
      min-height: 1.2rem;
      color: #b91c1c;
      font-size: 0.9rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    @media (max-width:640px) {
      .card {
        padding: 1.25rem;
      }

      .card.recovery-active .card-tools {
        position: static;
        width: 100%;
        justify-content: flex-end;
      }

      .card.recovery-active {
        padding-bottom: 3rem;
      }

      .status-row {
        align-items: flex-start;
      }

      .actions {
        flex-direction: column;
        align-items: stretch;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="content">
    <div class="card" id="card">
      <div class="card-tools" id="card-tools" style="display:none;">
        <button class="tool-btn warning" id="reset-settings-icon" type="button" style="display:none;"
          aria-label="Reset settings to defaults" title="Reset settings to defaults">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M13 3a9 9 0 1 0 8.95 10h-2.02A7 7 0 1 1 13 5c1.93 0 3.68.78 4.95 2.05L15 10h7V3l-2.62 2.62A8.96 8.96 0 0 0 13 3z" />
          </svg>
        </button>
        <button class="tool-btn danger" id="format-storage-icon" type="button" style="display:none;"
          aria-label="Format storage" title="Format storage">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M9 3a1 1 0 0 0-1 1v1H5.5a1 1 0 1 0 0 2H6v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7h.5a1 1 0 1 0 0-2H16V4a1 1 0 0 0-1-1H9Zm1 2h4V5h-4V5Zm-1 4a1 1 0 1 1 2 0v8a1 1 0 1 1-2 0V9Zm6-1a1 1 0 0 1 1 1v8a1 1 0 1 1-2 0V9a1 1 0 0 1 1-1Z" />
          </svg>
        </button>
      </div>
      <h1 id="title">Coinbox is starting</h1>
      <div class="status-row" id="status-row">
        <span class="badge" id="countdown">{{SECONDS}}</span>
        <div class="status-text" id="status-text">seconds remaining</div>
      </div>
      <p class="status-text" id="device-info" style="display:none;"></p>
      <p class="status-text strong" id="ota-status" style="display:none;">Awaiting OTA update...</p>
      <div class="actions" id="actions">
        <a class="btn primary" id="start-now" href="/skip">Start now</a>
        <a class="btn" id="stay" href="#">Enter recovery mode</a>
      </div>
      <p class="status-text" id="handoff-note" style="display:none;"></p>
      <p class="note" id="extend-note">{{ EXTEND_NOTE }}</p>
    </div>
  </div>
  <div class="modal-backdrop glyph-overlay-exempt" id="recovery-auth-modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="recovery-auth-title">
      <h2 id="recovery-auth-title">Authentication Required</h2>
      <p class="modal-copy">Enter the UI password or the 4-digit recovery PIN to unlock recovery actions.</p>
      <div class="modal-field">
        <label for="recovery-auth-password">Password</label>
        <input id="recovery-auth-password" type="password" maxlength="64" autocomplete="current-password">
      </div>
      <div class="modal-field">
        <label for="recovery-auth-pin">Recovery PIN</label>
        <input id="recovery-auth-pin" class="pin-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="4 digits">
      </div>
      <div class="modal-error" id="recovery-auth-error" aria-live="polite"></div>
      <div class="modal-actions">
        <button class="btn" id="recovery-auth-cancel" type="button">Cancel</button>
        <button class="btn primary" id="recovery-auth-submit" type="button">Unlock</button>
      </div>
    </div>
  </div>
  <script>
    if (window.COINBOX_GLYPHS && typeof window.COINBOX_GLYPHS.sprinkleBackgroundGlyphs === 'function') {
      window.COINBOX_GLYPHS.sprinkleBackgroundGlyphs();
    }

    let remaining = {{ SECONDS }};
    let autoRefresh = {{ AUTO_REFRESH }};
    let isRecovery = {{ IS_RECOVERY }};
    let forceHandoff = 0;
    let laserExtensionSeen = {{ LASER_EXTENSION_SEEN }};
    const el = document.getElementById('countdown');
    const cardEl = document.getElementById('card');
    const statusRow = document.getElementById('status-row');
    const actions = document.getElementById('actions');
    const titleEl = document.getElementById('title');
    const statusText = document.getElementById('status-text');
    const deviceInfoText = document.getElementById('device-info');
    const otaStatusText = document.getElementById('ota-status');
    const stayBtn = document.getElementById('stay');
    const startBtn = document.getElementById('start-now');
    const extendNote = document.getElementById('extend-note');
    const handoffNote = document.getElementById('handoff-note');
    const resetBtn = document.getElementById('reset-settings-icon');
    const formatBtn = document.getElementById('format-storage-icon');
    const cardTools = document.getElementById('card-tools');
    const recoveryAuthModal = document.getElementById('recovery-auth-modal');
    const recoveryAuthPasswordInput = document.getElementById('recovery-auth-password');
    const recoveryAuthPinInput = document.getElementById('recovery-auth-pin');
    const recoveryAuthError = document.getElementById('recovery-auth-error');
    const recoveryAuthCancelBtn = document.getElementById('recovery-auth-cancel');
    const recoveryAuthSubmitBtn = document.getElementById('recovery-auth-submit');
    let resetting = false;
    let formatting = false;
    let skipRequestSent = false;
    let handoffPollIntervalId = null;
    let handoffSkipRetryIntervalId = null;
    let handoffPollInFlight = false;
    let handoffSkipInFlight = false;
    let handoffCompleted = false;
    let recoveryAuthRequired = null;
    let recoveryAuthToken = '';
    let recoveryAuthDialogPromise = null;
    const handoffRoute = '/skip';
    const LASER_EXTENDED_NOTE = 'Laser beam interrupted three times. Countdown extended.';
    const MAIN_HANDOFF_POLL_MS = 250;
    const MAIN_HANDOFF_SKIP_RETRY_MS = 750;
    const MAIN_HANDOFF_REQUEST_TIMEOUT_MS = 1500;
    const MAIN_HANDOFF_CONNECTION_MONITOR_DELAY_MS = 4000;
    const MAIN_HANDOFF_CONNECTION_MONITOR_POLL_MS = 500;
    document.documentElement.dataset.pageReady = '1';
    function markLaserExtensionSeen() {
      laserExtensionSeen = true;
      if (extendNote) {
        extendNote.textContent = LASER_EXTENDED_NOTE;
      }
    }

    function extractLaserExtensionSeenFromHtml(html) {
      if (!html) return false;
      const scriptMatch = html.match(/let\s+laserExtensionSeen\s*=\s*(\d+)\s*;/i);
      return scriptMatch ? parseInt(scriptMatch[1], 10) === 1 : false;
    }

    function updateToolButtons() {
      const busy = resetting || formatting;
      if (resetBtn) {
        resetBtn.disabled = busy;
        resetBtn.title = resetting ? 'Resetting settings...' : 'Reset settings to defaults';
      }
      if (formatBtn) {
        formatBtn.disabled = busy;
        formatBtn.title = formatting ? 'Formatting...' : 'Format storage';
      }
    }

    function setRecoveryStatus(info) {
      if (!statusText) return;
      const lines = [];

      if (info && info.sta_ssid) {
        lines.push(`Connected to: ${info.sta_ssid}`);
        lines.push(`IP: ${(info && info.sta) || 'not assigned'}`);
        lines.push('');
      }

      lines.push('Recovery AP: coinboxrecovery')
      lines.push(`AP IP: ${(info && info.ap) || 'not assigned'}`);

      statusText.textContent = lines.join('\n');
    }

    function setRecoveryDeviceInfo(info) {
      if (!deviceInfoText) return;
      const lines = [
        `Firmware: ${(info && info.firmware_version) || 'unknown'}`,
        `Hardware: ${(info && info.hardware_version) || 'unknown'}`,
        `Vendor: ${(info && info.vendor) || 'unknown'}`,
        `MAC: ${(info && info.mac) || 'unknown'}`,
      ];
      deviceInfoText.textContent = lines.join('\n');
    }

    async function refreshDeviceIps() {
      try {
        const res = await fetch('/network/ips', { cache: 'no-store' });
        if (!res.ok) throw new Error('Failed to fetch IP addresses');
        const data = await res.json();
        setRecoveryStatus(data || {});
      } catch (_) {
        setRecoveryStatus({});
      }
    }

    async function fetchRecoveryDeviceInfo() {
      try {
        const res = await fetch('/device/info', { cache: 'no-store' });
        if (!res.ok) throw new Error('Failed to fetch device info');
        const data = await res.json();
        recoveryAuthRequired = !!data?.auth_required;
        setRecoveryDeviceInfo(data || {});
      } catch (_) {
        if (typeof recoveryAuthRequired !== 'boolean') {
          recoveryAuthRequired = true;
        }
        setRecoveryDeviceInfo({});
      }
    }

    function extractCountdownFromHtml(html) {
      if (!html) return null;
      const badgeMatch = html.match(/id="countdown">\s*(\d+)\s*</i);
      if (badgeMatch) return parseInt(badgeMatch[1], 10);
      const scriptMatch = html.match(/let\s+remaining\s*=\s*(\d+)\s*;/i);
      if (scriptMatch) return parseInt(scriptMatch[1], 10);
      return null;
    }

    async function syncCountdownHint() {
      if (isRecovery || laserExtensionSeen || remaining <= 0) {
        return;
      }

      try {
        const res = await fetch('/', { cache: 'no-store' });
        if (!res.ok) return;
        const html = await res.text();
        const serverRemaining = extractCountdownFromHtml(html);
        const serverLaserExtensionSeen = extractLaserExtensionSeenFromHtml(html);
        if (serverRemaining === null || Number.isNaN(serverRemaining)) {
          return;
        }

        if (serverLaserExtensionSeen) {
          markLaserExtensionSeen();
        }

        const jump = serverRemaining - remaining;
        if (jump > 1) {
          remaining = serverRemaining;
          el.textContent = remaining;
        }
      } catch (_) { }
    }

    function buildCacheBustedUrl(path) {
      const url = new URL(path, window.location.origin);
      url.searchParams.set('_cb', `${Date.now()}`);
      return url.toString();
    }

    function xhrGet(url, timeoutMs = MAIN_HANDOFF_REQUEST_TIMEOUT_MS) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.timeout = timeoutMs;
        xhr.onload = () => {
          resolve({
            status: xhr.status,
            responseURL: xhr.responseURL || url,
            responseText: xhr.responseText || '',
          });
        };
        xhr.onerror = () => reject(new Error('Network request failed'));
        xhr.ontimeout = () => reject(new Error('Network request timed out'));
        xhr.send();
      });
    }

    function clearHandoffTimers() {
      if (handoffPollIntervalId !== null) {
        clearInterval(handoffPollIntervalId);
        handoffPollIntervalId = null;
      }
      if (handoffSkipRetryIntervalId !== null) {
        clearInterval(handoffSkipRetryIntervalId);
        handoffSkipRetryIntervalId = null;
      }
    }

    function startHandoffDisconnectWatch() {
      const monitor = window.COINBOX_CONNECTION_MONITOR;
      if (!monitor || typeof monitor.startDisconnectWatch !== 'function') {
        return;
      }

      monitor.startDisconnectWatch({
        delayMs: MAIN_HANDOFF_CONNECTION_MONITOR_DELAY_MS,
        pollMs: MAIN_HANDOFF_CONNECTION_MONITOR_POLL_MS,
      });
    }

    function clearHandoffDisconnectWatch() {
      const monitor = window.COINBOX_CONNECTION_MONITOR;
      if (!monitor || typeof monitor.clearDisconnectWatch !== 'function') {
        return;
      }

      monitor.clearDisconnectWatch();
    }

    function tryNavigateToMainApp(finalUrl) {
      if (handoffCompleted) {
        return true;
      }

      const resolvedUrl = new URL(finalUrl || window.location.href, window.location.origin);
      const path = resolvedUrl.pathname || '/';
      if (path !== '/sounds/' && path !== '/login') {
        return false;
      }

      handoffCompleted = true;
      clearHandoffTimers();
      clearHandoffDisconnectWatch();
      location.replace(resolvedUrl.toString());
      return true;
    }

    async function probeMainAppReady() {
      if (!forceHandoff || handoffCompleted || handoffPollInFlight) {
        return;
      }

      handoffPollInFlight = true;
      try {
        const response = await xhrGet(buildCacheBustedUrl('/sounds/'));
        const resolvedUrl = new URL(response.responseURL || window.location.href, window.location.origin);
        const resolvedPath = resolvedUrl.pathname || '/';
        if (response.status === 401 && resolvedPath === '/sounds/') {
          tryNavigateToMainApp('/login?next=%2Fsounds%2F');
          return;
        }
        tryNavigateToMainApp(response.responseURL);
      } catch (_) {
      } finally {
        handoffPollInFlight = false;
      }
    }

    async function triggerSkipRequest() {
      if (!forceHandoff || handoffCompleted || handoffSkipInFlight) {
        return;
      }

      handoffSkipInFlight = true;
      try {
        const response = await xhrGet(buildCacheBustedUrl(handoffRoute));
        tryNavigateToMainApp(response.responseURL);
      } catch (_) {
      } finally {
        handoffSkipInFlight = false;
      }
    }

    function beginMainAppHandoff(triggerSkip) {
      if (handoffCompleted) {
        return;
      }

      forceHandoff = 1;
      isRecovery = 0;
      autoRefresh = 0;
      renderStartingCard();
      startHandoffDisconnectWatch();

      clearHandoffTimers();
      if (triggerSkip) {
        triggerSkipRequest();
        handoffSkipRetryIntervalId = setInterval(() => {
          triggerSkipRequest();
        }, MAIN_HANDOFF_SKIP_RETRY_MS);
      }
      probeMainAppReady();
      handoffPollIntervalId = setInterval(() => {
        probeMainAppReady();
      }, MAIN_HANDOFF_POLL_MS);
    }

    function renderRecovery() {
      clearHandoffDisconnectWatch();
      if (cardEl) cardEl.classList.add('recovery-active');
      titleEl.textContent = 'Recovery Mode';
      statusRow.style.display = 'flex';
      el.style.display = 'none';
      if (deviceInfoText) deviceInfoText.style.display = '';
      if (otaStatusText) otaStatusText.style.display = '';
      actions.style.display = 'flex';
      if (extendNote) extendNote.style.display = 'none';
      if (handoffNote) handoffNote.style.display = 'none';
      if (cardTools) cardTools.style.display = 'flex';
      stayBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';
      if (formatBtn) formatBtn.style.display = 'inline-flex';
      updateToolButtons();
      startBtn.textContent = 'Exit recovery mode';
      autoRefresh = 0;
      isRecovery = true;
      refreshDeviceIps();
      fetchRecoveryDeviceInfo();
    }

    async function enterRecovery() {
      if (isRecovery) return;
      try {
        await fetch('/recovery');
      } catch (_) { }
      renderRecovery();
    }

    async function authenticateRecovery({ password, pin }) {
      const attempts = [];
      const passwordValue = typeof password === 'string' ? password.trim() : '';
      const pinValue = typeof pin === 'string' ? pin.trim() : '';

      if (passwordValue) {
        attempts.push({ password: passwordValue });
      }
      if (pinValue) {
        if (!/^\d{4}$/.test(pinValue)) {
          throw new Error('Recovery PIN must be exactly 4 digits');
        }
        attempts.push({ recovery_code: parseInt(pinValue, 10) });
      }
      if (!attempts.length) {
        throw new Error('Enter a password or recovery PIN');
      }

      for (const payload of attempts) {
        const res = await fetch('/recovery/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (res.ok) {
          const data = await res.json().catch(() => ({}));
          recoveryAuthToken = data?.token || '';
          return;
        }

        if (res.status === 401) {
          continue;
        }

        let reason = '';
        try { reason = (await res.text()).trim(); } catch (_) { }
        throw new Error(reason || 'Authentication failed');
      }

      throw new Error('Authentication failed');
    }

    function setRecoveryAuthError(message) {
      if (recoveryAuthError) {
        recoveryAuthError.textContent = message || '';
      }
    }

    function setRecoveryAuthDialogBusy(busy) {
      if (recoveryAuthPasswordInput) recoveryAuthPasswordInput.disabled = !!busy;
      if (recoveryAuthPinInput) recoveryAuthPinInput.disabled = !!busy;
      if (recoveryAuthCancelBtn) recoveryAuthCancelBtn.disabled = !!busy;
      if (recoveryAuthSubmitBtn) recoveryAuthSubmitBtn.disabled = !!busy;
    }

    function closeRecoveryAuthDialog(result) {
      if (!recoveryAuthDialogPromise) return;
      const { resolve } = recoveryAuthDialogPromise;
      recoveryAuthDialogPromise = null;
      if (recoveryAuthModal) {
        recoveryAuthModal.hidden = true;
        recoveryAuthModal.classList.remove('open');
      }
      setRecoveryAuthError('');
      setRecoveryAuthDialogBusy(false);
      if (recoveryAuthPasswordInput) recoveryAuthPasswordInput.value = '';
      if (recoveryAuthPinInput) recoveryAuthPinInput.value = '';
      resolve(result);
    }

    function openRecoveryAuthDialog() {
      if (recoveryAuthDialogPromise) {
        return recoveryAuthDialogPromise.promise;
      }

      let resolveDialog;
      const promise = new Promise((resolve) => {
        resolveDialog = resolve;
      });
      recoveryAuthDialogPromise = { promise, resolve: resolveDialog };
      setRecoveryAuthError('');
      setRecoveryAuthDialogBusy(false);
      if (recoveryAuthModal) {
        recoveryAuthModal.hidden = false;
        recoveryAuthModal.classList.add('open');
      }
      if (recoveryAuthPasswordInput) recoveryAuthPasswordInput.value = '';
      if (recoveryAuthPinInput) recoveryAuthPinInput.value = '';
      const preferredInput = recoveryAuthPasswordInput || recoveryAuthPinInput;
      if (preferredInput) {
        setTimeout(() => preferredInput.focus(), 0);
      }
      return promise;
    }

    async function submitRecoveryAuthDialog() {
      const password = recoveryAuthPasswordInput ? recoveryAuthPasswordInput.value : '';
      const pin = recoveryAuthPinInput ? recoveryAuthPinInput.value : '';
      setRecoveryAuthError('');
      setRecoveryAuthDialogBusy(true);

      try {
        await authenticateRecovery({ password, pin });
        closeRecoveryAuthDialog(true);
      } catch (e) {
        setRecoveryAuthDialogBusy(false);
        setRecoveryAuthError((e && e.message) || 'Authentication failed');
      }
    }

    async function ensureRecoveryAuthenticated() {
      if (!isRecovery) return false;
      if (recoveryAuthRequired === null) {
        await fetchRecoveryDeviceInfo();
      }
      if (!recoveryAuthRequired) {
        return true;
      }
      if (recoveryAuthToken) {
        return true;
      }

      return await openRecoveryAuthDialog();
    }

    async function resetSettings() {
      if (!isRecovery || !resetBtn || resetting || formatting) return;
      if (!confirm('Reset all configured settings to their defaults? This will keep your files but reset all settings, including security and network settings.')) return;
      if (!await ensureRecoveryAuthenticated()) return;
      resetting = true;
      updateToolButtons();
      try {
        const headers = recoveryAuthToken ? { 'X-Recovery-Auth': recoveryAuthToken } : {};
        const res = await fetch('/settings/reset', { method: 'POST', headers });
        if (!res.ok) {
          let reason = '';
          try { reason = (await res.text()).trim(); } catch (_) { }
          if (res.status === 401) {
            recoveryAuthToken = '';
          }
          throw new Error(reason || 'Reset failed');
        }
        recoveryAuthToken = '';
        recoveryAuthRequired = false;
        fetchRecoveryDeviceInfo();
        alert('Settings have been restored to defaults. You may need to reconnect to the device after exiting recovery mode.');
      } catch (e) {
        alert(e.message || 'Reset failed');
      }
      resetting = false;
      updateToolButtons();
    }

    async function formatStorage() {
      if (!isRecovery || !formatBtn || formatting || resetting) return;
      if (!confirm('Format storage? This will delete all files.')) return;
      if (!await ensureRecoveryAuthenticated()) return;
      formatting = true;
      updateToolButtons();
      try {
        const headers = recoveryAuthToken ? { 'X-Recovery-Auth': recoveryAuthToken } : {};
        const res = await fetch('/format', { method: 'POST', headers });
        if (!res.ok) {
          let reason = '';
          try { reason = (await res.text()).trim(); } catch (_) { }
          if (res.status === 401) {
            recoveryAuthToken = '';
          }
          throw new Error(reason || 'Format failed');
        }
        alert('Storage formatted');
      } catch (e) {
        alert(e.message || 'Format failed');
      }
      formatting = false;
      updateToolButtons();
    }

    function renderStartingCard() {
      if (cardEl) cardEl.classList.remove('recovery-active');
      titleEl.textContent = 'Starting main application';
      statusRow.style.display = 'none';
      if (deviceInfoText) deviceInfoText.style.display = 'none';
      if (otaStatusText) otaStatusText.style.display = 'none';
      actions.style.display = 'none';
      if (extendNote) extendNote.style.display = 'none';
      if (cardTools) cardTools.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'none';
      if (formatBtn) formatBtn.style.display = 'none';
      if (handoffNote) {
        handoffNote.style.display = '';
        handoffNote.textContent = 'Getting things ready...';
      }
    }

    function requestSkipHandoff() {
      if (skipRequestSent || forceHandoff) {
        return;
      }

      skipRequestSent = true;
      beginMainAppHandoff(true);
    }

    function tick() {
      if (forceHandoff) {
        return;
      }
      if (isRecovery) {
        return;
      }
      if (remaining <= 0) {
        el.textContent = '0';
        if (autoRefresh) {
          beginMainAppHandoff(true);
        }
        return;
      }
      el.textContent = remaining;
      remaining -= 1;
    }

    stayBtn.addEventListener('click', (e) => { e.preventDefault(); enterRecovery(); });
    if (startBtn) {
      startBtn.addEventListener('click', (e) => {
        e.preventDefault();
        requestSkipHandoff();
      });
    }
    if (resetBtn) { resetBtn.addEventListener('click', () => { resetSettings(); }); }
    if (formatBtn) { formatBtn.addEventListener('click', () => { formatStorage(); }); }
    if (recoveryAuthCancelBtn) {
      recoveryAuthCancelBtn.addEventListener('click', () => { closeRecoveryAuthDialog(false); });
    }
    if (recoveryAuthSubmitBtn) {
      recoveryAuthSubmitBtn.addEventListener('click', () => { submitRecoveryAuthDialog(); });
    }
    if (recoveryAuthModal) {
      recoveryAuthModal.addEventListener('click', (e) => {
        if (e.target === recoveryAuthModal) {
          closeRecoveryAuthDialog(false);
        }
      });
    }
    if (recoveryAuthPasswordInput) {
      recoveryAuthPasswordInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          submitRecoveryAuthDialog();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          closeRecoveryAuthDialog(false);
        }
      });
    }
    if (recoveryAuthPinInput) {
      recoveryAuthPinInput.addEventListener('input', () => {
        recoveryAuthPinInput.value = recoveryAuthPinInput.value.replace(/\D+/g, '').slice(0, 4);
      });
      recoveryAuthPinInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          submitRecoveryAuthDialog();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          closeRecoveryAuthDialog(false);
        }
      });
    }
    if (cardEl && !isRecovery) { cardEl.classList.remove('recovery-active'); }
    if (laserExtensionSeen) { markLaserExtensionSeen(); }
    if (forceHandoff) {
      beginMainAppHandoff(false);
    } else if (isRecovery) {
      renderRecovery();
    }
    setInterval(() => { if (isRecovery && !forceHandoff) { refreshDeviceIps(); } }, 5000);
    setInterval(() => { if (!isRecovery && !forceHandoff) { syncCountdownHint(); } }, 1500);
    tick(); setInterval(tick, 1000);
  </script>
</body>

</html>
