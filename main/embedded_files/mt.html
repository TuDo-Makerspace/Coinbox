<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maintenance</title>
  <style>
    :root {
      --text: #0f172a;
      --muted: #475569;
      --card: #fff;
      --border: #e5e7eb;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: var(--text);
      line-height: 1.5;
    }
    .content {
      padding: clamp(1rem, 2vw + 0.5rem, 2.5rem);
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    h1 {
      font-size: clamp(1.6rem, 1vw + 1.3rem, 2.1rem);
    }
    p {
      color: var(--muted);
    }
    .log-box {
      margin-top: 0.5em;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1em;
      max-height: 320px;
      overflow-y: auto;
      font-family: "SFMono-Regular","Consolas","Liberation Mono",monospace;
      background: #f8fafc;
      font-size: 0.95rem;
    }
    .log-section { display: flex; flex-direction: column; gap: 0.35rem; }
    .log-controls { display: flex; justify-content: flex-end; }
    .log-line {
      white-space: pre-wrap;
      display: block;
      padding: 0.05em 0;
      color: var(--text);
    }
    .log-line.info { color: #16a34a; }
    .log-line.warn { color: #d97706; }
    .log-line.error { color: #dc2626; }
    .log-line.debug { color: #2563eb; }
    .actions {
      margin-top: 0.25em;
      display: flex;
      gap: 0.75em;
      flex-wrap: wrap;
    }
    .actions button,
    .log-controls button {
      padding: 0.7em 1.1em;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #e5edff;
      cursor: pointer;
      font-weight: 700;
      min-width: 140px;
      flex: 1 1 180px;
      transition: transform 0.1s, background 0.15s;
    }
    .log-controls button { flex: 0 0 auto; }
    .actions button:hover,
    .log-controls button:hover { background: #d7e4ff; }
    .actions button:active,
    .log-controls button:active { transform: scale(0.98); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.05);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .card h2 { margin: 0; font-size: 1.2rem; }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .tone-status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--muted);
      font-weight: 600;
    }
    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 0 4px rgba(239,68,68,0.2);
    }
    .status-dot[data-state="on"] {
      background: #16a34a;
      box-shadow: 0 0 0 4px rgba(22,163,74,0.2);
    }
    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .slider-meta {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 600;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #2563eb;
    }
    .tone-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .tone-actions button {
      padding: 0.85em 1.3em;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #e5edff;
      cursor: pointer;
      font-weight: 700;
      min-width: 140px;
      transition: transform 0.1s, background 0.15s, box-shadow 0.15s;
    }
    .tone-actions button:hover { background: #d7e4ff; }
    .tone-actions button:active { transform: scale(0.98); }
    .amp-control {
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .amp-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .amp-row .tone-actions { margin-left: auto; }
    .note { color: var(--muted); font-size: 0.95rem; }
    .dual-slider {
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 1.5rem;
    }
    .sensor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 0.85rem;
    }
    .sensor {
      padding: 0.9rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .sensor-label { color: var(--muted); font-weight: 600; font-size: 0.95rem; }
    .sensor-reading { font-size: 1.1rem; font-weight: 700; }
    .sensor-note { color: var(--muted); font-size: 0.95rem; }
    .sensor-chart {
      width: 100%;
      height: 150px;
      display: block;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }
    @media (max-width: 640px) {
      .actions { flex-direction: column; }
      .actions button {
        width: 100%;
        flex: none;
      }
      .log-controls { width: 100%; }
      .log-controls button { width: 100%; }
      .log-box { max-height: 55vh; }
      .card { padding: 1rem; }
      .dual-slider { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="navbar"></div>
  <script src="/navbar.js"></script>

  <div class="content">
    <h1>Maintenance</h1>

    <div class="actions">
      <button id="restart-device">Restart device</button>
      <button id="format-storage">Format storage</button>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>Sensors</h2>
      </div>
      <div class="sensor-grid">
        <div class="sensor">
          <div class="sensor-label">Laser receiver (GPIO 23)</div>
          <div class="sensor-reading" id="laser-level">--</div>
          <div class="sensor-note" id="laser-meaning">Waiting for data...</div>
          <canvas class="sensor-chart" id="laser-chart" aria-label="Laser level over time"></canvas>
        </div>
        <div class="sensor">
          <div class="sensor-label">Hall lid sensor (GPIO 2)</div>
          <div class="sensor-reading" id="hall-level">--</div>
          <div class="sensor-note" id="hall-meaning">Waiting for data...</div>
          <canvas class="sensor-chart" id="hall-chart" aria-label="Lid level over time"></canvas>
        </div>
      </div>
      <p class="note" id="gpio-updated">Last updated: --</p>
    </div>

    <div class="card">
      <div class="card-header">
        <div>
          <h2>Audio test</h2>
        </div>
        <div class="tone-status">
          <span class="status-dot" id="tone-status-dot" data-state="off"></span>
          <span id="tone-status-text">Stopped</span>
        </div>
      </div>
      <div class="dual-slider">
        <div class="slider-row">
          <label for="tone-frequency">Frequency</label>
          <input type="range" id="tone-frequency" min="50" max="8000" value="440" step="5">
          <div class="slider-meta">
            <span id="tone-frequency-value">440 Hz</span>
            <span id="tone-range-label">50-8000 Hz</span>
          </div>
        </div>
        <div class="slider-row">
          <label for="tone-volume">Volume</label>
          <input type="range" id="tone-volume" min="0" max="100" value="100" step="1">
          <div class="slider-meta">
            <span id="tone-volume-value">100%</span>
            <span id="tone-volume-label">0-100%</span>
          </div>
        </div>
      </div>
      <div class="tone-actions">
        <button id="tone-toggle">Play</button>
      </div>
      <div class="amp-control">
        <div class="amp-row">
          <div class="tone-status">
            <span class="status-dot" id="amp-status-dot" data-state="off"></span>
            <span id="amp-status-text">Amp muted</span>
          </div>
          <div class="tone-actions">
            <button id="amp-toggle">Unmute amp</button>
          </div>
        </div>
        <p class="note">This only toggles the amplifier mute line; DAC stays active.</p>
      </div>
    </div>

    <div class="card log-section">
      <div class="card-header">
        <h2>Logs</h2>
        <div class="log-controls">
          <button id="download-log">Download log</button>
        </div>
      </div>
      <div id="log-box" class="log-box">Loading log...</div>
    </div>
  </div>

  <script>
    const box = document.getElementById('log-box');
    const LOG_POLL_MS = 3000;
    let logIntervalId;
    let logLoading = false;
    let lastLogText = null;
    let lastRenderWasError = false;

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function classify(line) {
      const trimmed = line.trim();
      const lower = trimmed.toLowerCase();
      if (/^(e\b|e\s|\berror\b|\berr\b)/i.test(trimmed) || lower.includes('error')) return 'error';
      if (/^(w\b|w\s|\bwarn\b|\bwarning\b)/i.test(trimmed) || lower.includes('warn')) return 'warn';
      if (/^(i\b|i\s|\binfo\b)/i.test(trimmed) || lower.includes('info')) return 'info';
      if (/^(d\b|d\s|\bdebug\b)/i.test(trimmed) || lower.includes('debug')) return 'debug';
      return '';
    }

    function renderLog(text) {
      if (!text) {
        box.textContent = '(empty)';
        return;
      }
      const lines = text.split(/\r?\n/);
      box.innerHTML = lines.map((line) => {
        const cls = classify(line);
        return `<span class="log-line ${cls}">${escapeHtml(line)}</span>`;
      }).join('');
      box.scrollTop = box.scrollHeight;
    }

    async function fetchLog() {
      if (logLoading) return;
      logLoading = true;
      try {
        const res = await fetch('/logs', { cache: 'no-store' });
        if (!res.ok) throw new Error('Failed to fetch log');
        const text = await res.text();
        if (!lastRenderWasError && text === lastLogText) return;
        renderLog(text);
        lastLogText = text;
        lastRenderWasError = false;
      } catch (e) {
        renderLog(e.message || 'Failed to fetch log');
        lastRenderWasError = true;
      } finally {
        logLoading = false;
      }
    }

    async function downloadLog() {
      try {
        const res = await fetch('/logs', { cache: 'no-store' });
        if (!res.ok) throw new Error('Failed to download log');
        const text = await res.text();
        const blob = new Blob([text], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'log.txt';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      } catch (e) {
        alert(e.message);
      }
    }

    const laserLevel = document.getElementById('laser-level');
    const laserMeaning = document.getElementById('laser-meaning');
    const hallLevel = document.getElementById('hall-level');
    const hallMeaning = document.getElementById('hall-meaning');
    const gpioUpdated = document.getElementById('gpio-updated');
    const laserChart = document.getElementById('laser-chart');
    const hallChart = document.getElementById('hall-chart');
    const laserHistory = [];
    const hallHistory = [];
    const MAX_GPIO_POINTS = 20;
    const GPIO_POLL_MS = 2000;
    let gpioIntervalId;
    let gpioLoading = false;

    function formatLevel(level) {
      if (level === 1) return 'High';
      if (level === 0) return 'Low';
      return '—';
    }

    function renderGpioState(data) {
      const laser = data?.laser || {};
      const hall = data?.hall || {};

      laserLevel.textContent = formatLevel(laser.level);
      laserMeaning.textContent = laser.beam_blocked ? 'Beam broken' : 'Beam clear';

      hallLevel.textContent = formatLevel(hall.level);
      hallMeaning.textContent = hall.lid_open ? 'Lid open' : 'Lid closed';

      // Track recent samples for plotting
      const now = new Date();
      laserHistory.push({
        t: now,
        value: typeof laser.level === 'number' ? laser.level : null,
      });
      hallHistory.push({
        t: now,
        value: typeof hall.level === 'number' ? hall.level : null,
      });
      if (laserHistory.length > MAX_GPIO_POINTS) laserHistory.shift();
      if (hallHistory.length > MAX_GPIO_POINTS) hallHistory.shift();
      renderSensorChart(laserChart, laserHistory, '#2563eb');
      renderSensorChart(hallChart, hallHistory, '#f97316');

      if (gpioUpdated) {
        const now = new Date();
        gpioUpdated.textContent = `Last updated: ${now.toLocaleTimeString()}`;
      }
    }

    function renderGpioError(msg) {
      laserLevel.textContent = '—';
      laserMeaning.textContent = msg || 'Failed to read GPIO';
      hallLevel.textContent = '—';
      hallMeaning.textContent = msg || 'Failed to read GPIO';
      renderSensorChart(laserChart, laserHistory, '#2563eb', true);
      renderSensorChart(hallChart, hallHistory, '#f97316', true);
    }

    async function fetchGpioState() {
      if (gpioLoading) return;
      gpioLoading = true;
      try {
        const res = await fetch('/gpio/state', { cache: 'no-store' });
        if (!res.ok) throw new Error('Failed to fetch GPIO state');
        const data = await res.json();
        renderGpioState(data);
      } catch (e) {
        renderGpioError(e.message || 'Failed to read GPIO');
      } finally {
        gpioLoading = false;
      }
    }

    function startGpioAutoRefresh() {
      if (gpioIntervalId) clearInterval(gpioIntervalId);
      gpioIntervalId = setInterval(() => {
        if (!document.hidden) fetchGpioState();
      }, GPIO_POLL_MS);
    }

    function renderSensorChart(canvas, history, color, showError) {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const width = canvas.clientWidth * dpr;
      const height = canvas.clientHeight * dpr;
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      ctx.clearRect(0, 0, width, height);

      const baseTextColor = '#94a3b8';
      ctx.font = `${12 * dpr}px sans-serif`;
      ctx.fillStyle = baseTextColor;
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'left';

      if (showError) {
        const msg = 'No data';
        const textWidth = ctx.measureText(msg).width;
        ctx.fillText(msg, (width - textWidth) / 2, height / 2);
        return;
      }

      if (!history.length) {
        const msg = 'Waiting for data...';
        const textWidth = ctx.measureText(msg).width;
        ctx.fillText(msg, (width - textWidth) / 2, height / 2);
        return;
      }

      const padding = 12 * dpr;
      const labelSpace = 24 * dpr;
      const leftPad = padding + labelSpace;
      const rightPad = padding;
      const plotWidth = width - leftPad - rightPad;
      const plotHeight = height - padding * 2;

      // Draw grid lines (0 and 1)
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1 * dpr;
      const labelX = padding;
      const labelBoxPadX = 4 * dpr;
      const labelBoxPadY = 2 * dpr;
      [0, 1].forEach((v) => {
        const y = padding + plotHeight - v * plotHeight;
        ctx.beginPath();
        ctx.moveTo(leftPad, y);
        ctx.lineTo(width - rightPad, y);
        ctx.stroke();
        const text = `${v}`;
        const metrics = ctx.measureText(text);
        const ascent = Math.abs(metrics.actualBoundingBoxAscent || 8 * dpr);
        const descent = Math.abs(metrics.actualBoundingBoxDescent || 2 * dpr);
        const textHeight = ascent + descent;
        const boxWidth = metrics.width + labelBoxPadX * 2;
        const boxHeight = textHeight + labelBoxPadY * 2;
        const boxX = labelX - labelBoxPadX;
        const boxY = y - textHeight / 2 - labelBoxPadY;
        ctx.fillStyle = '#fff';
        ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
        ctx.fillStyle = baseTextColor;
        ctx.fillText(text, labelX, y);
      });

      ctx.strokeStyle = color;
      ctx.lineWidth = 2 * dpr;
      ctx.beginPath();
      history.forEach((p, idx) => {
        if (typeof p.value !== 'number') return;
        const x = leftPad + (plotWidth / Math.max(1, history.length - 1)) * idx;
        const y = padding + plotHeight - (p.value * plotHeight);
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    const toneSlider = document.getElementById('tone-frequency');
    const toneValue = document.getElementById('tone-frequency-value');
    const toneRangeLabel = document.getElementById('tone-range-label');
    const toneVolume = document.getElementById('tone-volume');
    const toneVolumeValue = document.getElementById('tone-volume-value');
    const toneVolumeLabel = document.getElementById('tone-volume-label');
    const toneToggle = document.getElementById('tone-toggle');
    const toneStatusDot = document.getElementById('tone-status-dot');
    const toneStatusText = document.getElementById('tone-status-text');
    const ampStatusDot = document.getElementById('amp-status-dot');
    const ampStatusText = document.getElementById('amp-status-text');
    const ampToggle = document.getElementById('amp-toggle');
    const TONE_POLL_MS = 2000;
    let toneDisabled = false;
    let toneBusy = false;
    let toneIntervalId = null;
    let ampBusy = false;

    function updateToneUI(data) {
      if (!data) return;
      const min = data.min_hz || Number(toneSlider.min);
      const max = data.max_hz || Number(toneSlider.max);
      toneSlider.min = min;
      toneSlider.max = max;
      const freq = data.freq_hz ? Math.round(data.freq_hz) : Math.round(Number(toneSlider.value) || 440);
      toneSlider.value = freq;
      toneValue.textContent = `${freq} Hz`;
      toneRangeLabel.textContent = `${Math.round(min)}-${Math.round(max)} Hz`;
      const volumePct = typeof data.volume_pct === 'number' ? Math.max(0, Math.min(100, data.volume_pct)) : Math.round(Number(toneVolume.value) || 100);
      toneVolume.value = Math.round(volumePct);
      toneVolumeValue.textContent = `${Math.round(volumePct)}%`;
      toneVolumeLabel.textContent = `0-${Math.round(100)}%`;
      toneDisabled = !!data.playback_active;
      toneSlider.disabled = toneDisabled;
      toneVolume.disabled = toneDisabled;
      const running = !!data.running;
      toneToggle.textContent = toneDisabled ? 'Disabled' : (running ? 'Stop' : 'Play');
      toneToggle.disabled = toneDisabled || toneBusy;
      if (toneDisabled) {
        toneStatusDot.dataset.state = 'off';
        toneStatusText.textContent = 'Disabled while device playback is active';
      } else {
        toneStatusDot.dataset.state = running ? 'on' : 'off';
        toneStatusText.textContent = running ? 'Playing' : 'Stopped';
      }
    }

    function updateAmpUI(data) {
      if (!data) return;
      const muted = !!data.muted;
      ampStatusDot.dataset.state = muted ? 'off' : 'on';
      ampStatusText.textContent = muted ? 'Amp muted' : 'Amp active';
      ampToggle.textContent = muted ? 'Unmute amp' : 'Mute amp';
      ampToggle.disabled = ampBusy;
    }

    async function fetchAmpStatus() {
      try {
        const res = await fetch('/amp/mute', { cache: 'no-store' });
        if (!res.ok) throw new Error('Failed to load amp status');
        const data = await res.json();
        updateAmpUI(data);
      } catch (e) {
        console.warn(e);
      }
    }

    async function setAmpMuted(mute) {
      const url = (typeof mute === 'boolean')
        ? `/amp/mute?mute=${mute ? '1' : '0'}`
        : '/amp/mute';
      const res = await fetch(url, { method: 'POST', cache: 'no-store' });
      if (!res.ok) {
        let reason = '';
        try { reason = (await res.text()).trim(); } catch (_) {}
        throw new Error(reason || 'Failed to set amp mute');
      }
      const data = await res.json();
      updateAmpUI(data);
      return data;
    }

    async function fetchToneStatus() {
      try {
        const res = await fetch('/audio/test', { cache: 'no-store' });
        if (!res.ok) throw new Error('Failed to load tone status');
        const data = await res.json();
        updateToneUI(data);
      } catch (e) {
        console.warn(e);
      }
    }

    async function sendTone(action, freq, volume) {
      const params = new URLSearchParams({ action });
      if (typeof freq === 'number' && !Number.isNaN(freq)) {
        params.set('freq', Math.round(freq));
      }
      if (typeof volume === 'number' && !Number.isNaN(volume)) {
        params.set('volume', Math.round(volume));
      }
      const res = await fetch(`/audio/test?${params.toString()}`, { method: 'POST' });
      if (!res.ok) {
        let reason = '';
        try { reason = (await res.text()).trim(); } catch (_) {}
        throw new Error(reason || 'Audio test command failed');
      }
      const data = await res.json();
      updateToneUI(data);
      return data;
    }

    toneSlider.addEventListener('input', () => {
      toneValue.textContent = `${Math.round(toneSlider.value)} Hz`;
    });

    toneSlider.addEventListener('change', async () => {
      if (toneDisabled || toneStatusDot.dataset.state !== 'on' || toneBusy) return;
      toneBusy = true;
      toneToggle.disabled = true;
      try {
        await sendTone('start', Number(toneSlider.value), Number(toneVolume.value));
      } catch (e) {
        alert(e.message || 'Failed to update tone');
      }
      toneToggle.disabled = false;
      toneBusy = false;
    });

    toneVolume.addEventListener('input', () => {
      toneVolumeValue.textContent = `${Math.round(toneVolume.value)}%`;
    });

    toneVolume.addEventListener('change', async () => {
      if (toneDisabled || toneStatusDot.dataset.state !== 'on' || toneBusy) return;
      toneBusy = true;
      toneToggle.disabled = true;
      try {
        await sendTone('start', Number(toneSlider.value), Number(toneVolume.value));
      } catch (e) {
        alert(e.message || 'Failed to update volume');
      }
      toneToggle.disabled = false;
      toneBusy = false;
    });

    toneToggle.addEventListener('click', async () => {
      if (toneDisabled || toneBusy) {
        if (toneDisabled) {
          alert('Audio test is disabled while playback is active.');
        }
        return;
      }
      toneBusy = true;
      toneToggle.disabled = true;
      try {
        const action = toneStatusDot.dataset.state === 'on' ? 'stop' : 'start';
        await sendTone(action, Number(toneSlider.value), Number(toneVolume.value));
      } catch (e) {
        alert(e.message || 'Audio test failed');
      }
      toneToggle.disabled = false;
      toneBusy = false;
    });

    ampToggle.addEventListener('click', async () => {
      if (ampBusy) return;
      ampBusy = true;
      ampToggle.disabled = true;
      try {
        await setAmpMuted(); // toggles on the device so UI desyncs do not matter
      } catch (e) {
        alert(e.message || 'Failed to toggle amp mute');
      }
      ampBusy = false;
      ampToggle.disabled = false;
    });

    document.getElementById('download-log').addEventListener('click', downloadLog);
    document.getElementById('restart-device').addEventListener('click', async () => {
      if (!confirm('Restart the device?')) return;
      try {
        const res = await fetch('/restart', { method: 'POST' });
        if (!res.ok) throw new Error('Restart failed');
        alert('Device restarting...');
        setTimeout(() => location.replace('/'), 800);
      } catch (e) {
        alert(e.message || 'Restart failed');
      }
    });
    document.getElementById('format-storage').addEventListener('click', async () => {
      if (!confirm('Format storage? This will delete all files.')) return;
      try {
        const res = await fetch('/format', { method: 'POST' });
        if (!res.ok) throw new Error('Format failed');
        alert('Storage formatted');
        location.reload();
      } catch (e) {
        alert(e.message);
      }
    });
    function startLogAutoRefresh() {
      if (logIntervalId) clearInterval(logIntervalId);
      logIntervalId = setInterval(() => {
        if (!document.hidden) fetchLog();
      }, LOG_POLL_MS);
    }
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        fetchLog();
        fetchGpioState();
        fetchToneStatus();
        fetchAmpStatus();
      }
    });
    function startToneAutoRefresh() {
      if (toneIntervalId) clearInterval(toneIntervalId);
      toneIntervalId = setInterval(() => {
        if (!document.hidden) fetchToneStatus();
      }, TONE_POLL_MS);
    }
    fetchLog();
    fetchGpioState();
    startLogAutoRefresh();
    startGpioAutoRefresh();
    fetchToneStatus();
    fetchAmpStatus();
    startToneAutoRefresh();
  </script>
</body>
</html>
