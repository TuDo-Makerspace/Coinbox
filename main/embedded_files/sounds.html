<!DOCTYPE html>
<html lang="en" data-boot-id="{{BOOT_ID}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coinbox Sounds</title>
  <script>document.documentElement.dataset.pageReady = '0';</script>
  <link rel="stylesheet" href="/glyphs.css">
  <script src="/glyphs.js"></script>
  <script src="/connection_monitor.js"></script>
  <script src="/navbar.js"></script>
  <style>
    :root {
      --card-bg: #fff;
      --border: #e5e7eb;
      --text: #0f172a;
      --muted: #4b5563;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: var(--text);
      line-height: 1.5;
      position: relative;
      overflow-x: hidden;
      isolation: isolate;
    }

    html[data-page-ready="0"] body {
      visibility: hidden;
    }
    .content {
      padding: clamp(1rem, 2vw + 0.5rem, 2.5rem);
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25em;
      width: 100%;
    }

    h1 { margin-bottom: 0.35em; font-size: clamp(1.6rem, 1vw + 1.4rem, 2.1rem); }
    .title-row {
      display: flex;
      align-items: center;
      gap: 0.75em;
      justify-content: space-between;
    }
    .subtext { color: var(--muted); margin-bottom: 0.8em; font-size: 1rem; }

    .dropzone {
      border: 2px dashed #94a3b8;
      border-radius: 12px;
      padding: clamp(1.1em, 2vw + 0.5em, 1.8em);
      background: var(--card-bg);
      text-align: center;
      color: #1f2937;
      cursor: pointer;
      order: 2;
      min-height: 120px;
      font-size: clamp(1rem, 1vw + 0.35rem, 1.15rem);
      display: grid;
      place-items: center;
      box-shadow: 0 10px 30px rgba(17, 24, 39, 0.05);
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .dropzone:hover {
      border-color: #64748b;
      background: #f8fafc;
      box-shadow: 0 12px 34px rgba(17, 24, 39, 0.08);
    }
    .dropzone.dragover {
      border-color: #2563eb;
      background: #eef2ff;
    }

    .file-list {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      order: 1;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    }
    .file-list:has(.file-empty) {
      background: transparent;
      border: none;
      border-radius: 0;
      overflow: visible;
      box-shadow: none;
    }

    .file-item {
      padding: 1em 1.1em;
      border-bottom: 1px solid #e0e0e0;
    }
    .file-item:last-child { border-bottom: none; }
    .file-empty {
      padding: 1em 0.15em 0.1em;
      text-align: center;
      color: var(--muted);
      font-size: 0.98rem;
      background: transparent;
    }

    .mobile-upload {
      display: none;
      padding: 0.7em 0.85em;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      min-width: 48px;
      min-height: 48px;
      align-items: center;
      justify-content: center;
    }
    .mobile-upload svg { width: 20px; height: 20px; fill: currentColor; }

    .file-row-main {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 0.85em;
    }

    .file-name-wrap {
      display: flex;
      align-items: center;
      min-width: 0;
      width: 100%;
    }

    .file-name {
      flex: 1;
      font-size: 1.05rem;
      font-weight: 700;
      font-family: "SFMono-Regular","Consolas","Liberation Mono",monospace;
      text-decoration: none;
      color: #1f2937;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      align-self: center;
      display: inline-flex;
      align-items: center;
    }
    .file-name:hover { color: #111827; }

    .file-name-edit {
      display: none;
      width: 100%;
      padding: 0.5em 0.65em;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      font-family: "SFMono-Regular","Consolas","Liberation Mono",monospace;
      color: #111827;
      background: #fff;
    }
    .file-name-edit:disabled {
      color: #94a3b8;
      background: #e5e7eb;
      border-color: #cbd5e1;
      cursor: not-allowed;
    }
    .file-item.editing .file-name { display: none; }
    .file-item.editing .file-name-edit { display: block; }

    .row-actions {
      display: flex;
      align-items: center;
      gap: 0.75em;
      flex-shrink: 0;
      justify-self: end;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 10px;
      cursor: pointer;
      color: #374151;
      user-select: none;
      transition: background 0.15s, transform 0.1s;
    }
    .icon-btn:hover { background: #eef2ff; }
    .icon-btn:active { background: #e5e7eb; transform: scale(0.98); }
    .play-btn {
      background: #e0f2fe;
      color: #0ea5e9;
      border-color: #bfdbfe;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }
    .play-btn svg { width: 18px; height: 18px; }
    .play-btn:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      border-color: #cbd5e1;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    .play-btn:disabled:hover,
    .play-btn:disabled:active {
      background: #e2e8f0;
      transform: none;
    }

    .playback-lock-note {
      display: block;
      margin-top: 0.25rem;
      margin-bottom: 0.25rem;
      padding: 0.6rem 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      color: #475569;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .playback-lock-note[hidden] { display: none !important; }
    .playback-lock-note.warning {
      border-color: #fcd34d;
      background: #fef3c7;
      color: #92400e;
    }

    .chev {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: background 0.15s, transform 0.1s;
    }
    .chev:hover { background: #eef2ff; }
    .chev[data-open="1"] { background: #e5e7eb; }
    .chev:active { transform: scale(0.98); }

    .details {
      display: none;
      margin-top: 0.75em;
      padding: 0.9em 0.75em 0.6em 0.75em;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
    }
    .details.open { display: block; }

    .details-inner {
      border: 1px solid #e6e6e6;
      border-radius: 12px;
      padding: 1em;
      background: #fff;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.9em 1em;
      align-items: start;
    }

    .prop {
      display: grid;
      grid-template-columns: 140px 1fr 90px auto;
      gap: 0.7em;
      align-items: center;
      margin: 1em 0;
    }
    .prop.prob-row { grid-column: 1; }
    .prop.vol-row { grid-column: 1 / -1; }

    .slider-wrap {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.45em;
      align-items: center;
    }

    .range-wrap {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .range-wrap input[type="range"] {
      width: 100%;
    }

    .volume-slider .volume-overdrive-marker {
      position: absolute;
      left: var(--volume-overdrive-marker-left, 50%);
      top: 50%;
      width: 1px;
      height: 14px;
      transform: translate(-50%, -50%);
      background: #94a3b8;
      border-radius: 999px;
      opacity: 0.8;
      pointer-events: none;
    }

    .nudge {
      border: none;
      background: #f1f5f9;
      border-radius: 6px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-weight: 700;
      line-height: 1;
      transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
      color: #1f2937;
      touch-action: manipulation;
    }
    .nudge:hover { background: #e2e8f0; }
    .nudge:active { background: #cbd5e1; box-shadow: inset 0 1px 2px rgba(0,0,0,0.08); transform: scale(0.98); }

    .prop input[type="number"] {
      width: 90px;
      padding: 0.45em;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .prop label {
      color: #111827;
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #2563eb;
    }

    .percent {
      font-size: 1rem;
      color: #475569;
      text-align: center;
      min-width: 24px;
    }

    .action-row {
      grid-column: 1 / -1;
      display: flex;
      justify-content: flex-end;
      margin-top: 0.25em;
    }
    .delete-btn {
      padding: 0.75em 1.5em;
      border-radius: 10px;
      border: 1px solid #f87171;
      background: #ef4444;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
    }
    .delete-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    .delete-btn:disabled {
      background: #cbd5e1;
      border-color: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    .delete-btn:hover { background: #dc2626; }
    .delete-btn:active { transform: scale(0.98); box-shadow: inset 0 1px 2px rgba(0,0,0,0.1); }
    .delete-btn:disabled:hover,
    .delete-btn:disabled:active {
      background: #cbd5e1;
      transform: none;
      box-shadow: none;
    }

    /* responsive tweaks */
    @media (max-width: 960px) {
      .content { padding: 1.25rem; gap: 1rem; }
      .file-row-main { grid-template-columns: 1fr auto; align-items: flex-start; }
      .file-name { width: 100%; white-space: normal; }
      .row-actions { justify-self: end; }
    }

    @media (max-width: 720px) {
      .file-item { padding: 0.9em; }
      .file-item.open .file-row-main {
        padding-bottom: 0.4em;
        border-bottom: 1px dashed #cbd5e1;
      }
      .details {
        margin-top: 0;
        padding: 0.35em 0.6em 0.45em 0.6em;
        border: none;
        background: transparent;
        border-radius: 10px;
      }
      .details-inner {
        border: none;
        background: transparent;
        padding: 0.35em 0 0 0;
      }
      .prop {
        grid-template-columns: 1fr auto;
        gap: 0.35em 0.5em;
        margin: 0.75em 0;
      }
      .prop label { grid-column: 1 / -1; }
      .slider-wrap {
        grid-template-columns: auto 1fr auto;
        grid-column: 1 / -1;
      }
      .prop input[type="number"] {
        width: 100%;
        max-width: none;
        grid-column: 1;
      }
      .percent {
        grid-column: 2;
        justify-self: end;
        align-self: center;
      }
      .action-row { justify-content: stretch; }
      .delete-btn { width: 100%; }
      .dropzone { display: none; }
      .mobile-upload { display: inline-flex; }
      .title-row { align-items: center; }
    }

    @media (max-width: 540px) {
      h1 { font-size: 1.45rem; }
      .dropzone { min-height: 110px; }
      .icon-btn,
      .chev { width: 42px; height: 42px; }
      .row-actions { gap: 0.6em; }
    }

    /* simple switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 26px;
    }
    .switch input { display: none; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #e57373;
      transition: 0.15s;
      border-radius: 999px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      top: 3px;
      background: white;
      transition: 0.15s;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .switch input:checked + .slider { background: #81c784; }
    .switch input:checked + .slider:before { transform: translateX(20px); }

    .upload-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(15, 23, 42, 0.42);
      z-index: 2000;
    }
    .upload-overlay.hidden {
      display: none;
    }
    .upload-card {
      min-width: min(420px, 92vw);
      max-width: 92vw;
      background: #ffffff;
      border: 1px solid #dbe4ee;
      border-radius: 12px;
      padding: 1rem 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.2);
    }
    .upload-spinner {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      border: 2px solid #bfdbfe;
      border-top-color: #2563eb;
      animation: upload-spin 0.8s linear infinite;
      flex: 0 0 auto;
    }
    .upload-text {
      font-size: 1rem;
      font-weight: 700;
      color: #0f172a;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    @keyframes upload-spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.COINBOX_GLYPHS && typeof window.COINBOX_GLYPHS.sprinkleBackgroundGlyphs === 'function') {
        window.COINBOX_GLYPHS.sprinkleBackgroundGlyphs();
      }

      const dropzone = document.getElementById('dropzone');
      const fileInput = document.getElementById('newfile');
      const basePath = (window.CURRENT_PATH || '/sounds/').trim();
      const safeBase = basePath.endsWith('/') ? basePath : basePath + '/';
      const FILE_PROBABILITY_MAX = 100;
      const FILE_VOLUME_MAX = 125;
      const markerPct = FILE_VOLUME_MAX > 0 ? (100 / FILE_VOLUME_MAX) * 100 : 50;
      document.documentElement.style.setProperty('--volume-overdrive-marker-left', `${markerPct}%`);

      const allowedAudioExts = ['.mp3'];
      const allowedAudioText = allowedAudioExts.join(', ');
      let playingRowId = null;
      let uploadInFlight = false;
      let playbackBlockedReason = '';
      const playbackLockNote = document.getElementById('playback-lock-note');
      const playbackSilentNote = document.getElementById('playback-silent-note');
      const playbackSoundStateNote = document.getElementById('playback-sound-state-note');

      const uploadOverlay = (() => {
        const overlay = document.createElement('div');
        overlay.id = 'upload-overlay';
        overlay.className = 'upload-overlay glyph-overlay-exempt hidden';
        overlay.setAttribute('aria-hidden', 'true');
        overlay.innerHTML = `
          <div class="upload-card" role="status" aria-live="polite" aria-atomic="true">
            <span class="upload-spinner" aria-hidden="true"></span>
            <span class="upload-text" data-k="upload-message">Uploading...</span>
          </div>
        `;
        document.body.appendChild(overlay);
        return overlay;
      })();

      function setUploadOverlay(active, message) {
        const msg = uploadOverlay.querySelector('[data-k="upload-message"]');
        if (msg) {
          msg.textContent = message || 'Uploading...';
        }
        uploadOverlay.classList.toggle('hidden', !active);
        uploadOverlay.setAttribute('aria-hidden', active ? 'false' : 'true');
      }

      function hasAllowedAudioExt(name) {
        const lower = (name || '').toLowerCase();
        return allowedAudioExts.some((ext) => lower.endsWith(ext));
      }

      function splitNameExt(name) {
        const text = String(name || '').trim();
        const dot = text.lastIndexOf('.');
        if (dot <= 0 || dot === text.length - 1) {
          return { base: text, ext: '' };
        }
        return { base: text.slice(0, dot), ext: text.slice(dot) };
      }

      function markPlaying(row) {
        playingRowId = row ? row.id : null;
      }

      function setPlaybackBlockedReason(reason) {
        playbackBlockedReason = String(reason || '').trim();
        const blocked = playbackBlockedReason.length > 0;
        const hasFiles = document.querySelector('.file-item') !== null;
        const showLockNote = blocked && hasFiles;
        document.querySelectorAll('button[data-k="play"]').forEach((btn) => {
          btn.disabled = blocked;
          btn.title = blocked ? playbackBlockedReason : 'Play';
          btn.setAttribute('aria-disabled', blocked ? 'true' : 'false');
        });
        if (playbackLockNote) {
          playbackLockNote.hidden = !showLockNote;
          playbackLockNote.textContent = showLockNote
            ? `Playback unavailable: ${playbackBlockedReason}.`
            : '';
        }
      }

      function clampPercent(value, fallback = 0) {
        const parsed = Number.parseInt(value, 10);
        if (Number.isNaN(parsed)) return fallback;
        return Math.min(100, Math.max(0, parsed));
      }

      function setSilentPlaybackNote(message) {
        const text = String(message || '').trim();
        if (!playbackSilentNote) return;
        playbackSilentNote.hidden = text.length === 0;
        playbackSilentNote.textContent = text;
      }

      function setSoundStateNote(message) {
        const text = String(message || '').trim();
        if (!playbackSoundStateNote) return;
        playbackSoundStateNote.hidden = text.length === 0;
        playbackSoundStateNote.textContent = text;
      }

      function refreshSoundStateNote() {
        const rows = Array.from(document.querySelectorAll('.file-item'));
        if (rows.length === 0) {
          setSoundStateNote('');
          return;
        }

        const sounds = rows.map((row) => ({
          enabled: row.dataset.enabled === '1',
          probability: clampPercent(row.dataset.probability, 0),
          volume: clampPercent(row.dataset.volume, 0),
        }));
        const enabledSounds = sounds.filter((sound) => sound.enabled);

        if (enabledSounds.length === 0) {
          setSoundStateNote('All sounds are disabled. No sound will be played on coin insertion.');
          return;
        }
        if (enabledSounds.every((sound) => sound.probability === 0)) {
          setSoundStateNote('All sounds have a weight of 0. No sound will be played on coin insertion.');
          return;
        }
        if (enabledSounds.every((sound) => sound.volume === 0)) {
          setSoundStateNote('All sounds have their volume set to 0%. No sound will be played on coin insertion.');
          return;
        }
        setSoundStateNote('');
      }

      function renderSilentPlaybackNote(audioConfig, gpioState) {
        const lidOpen = !!gpioState?.hall?.lid_open;
        const lidClosedVolumePct = clampPercent(audioConfig?.lid_closed_volume_pct, 100);
        const lidOpenVolumePct = clampPercent(audioConfig?.lid_open_volume_pct, 25);

        if (!lidOpen && lidClosedVolumePct === 0) {
          setSilentPlaybackNote('The Lid closed volume setting is set to 0%. Sounds will be muted while the lid is closed!');
          return;
        }
        if (lidOpen && lidOpenVolumePct === 0) {
          setSilentPlaybackNote('Lid open volume is 0%, so playback stays silent while the lid is open.');
          return;
        }
        setSilentPlaybackNote('');
      }

      async function refreshSilentPlaybackNote() {
        try {
          const [audioConfigRes, gpioStateRes] = await Promise.all([
            fetch('/audio/config', { cache: 'no-store' }),
            fetch('/gpio/state', { cache: 'no-store' }),
          ]);
          if (!audioConfigRes.ok || !gpioStateRes.ok) {
            throw new Error(`audio=${audioConfigRes.status} gpio=${gpioStateRes.status}`);
          }
          const [audioConfig, gpioState] = await Promise.all([
            audioConfigRes.json(),
            gpioStateRes.json(),
          ]);
          renderSilentPlaybackNote(audioConfig, gpioState);
        } catch (e) {
          console.warn('Failed to refresh playback warning note', e);
          setSilentPlaybackNote('');
        }
      }

      async function refreshPlaybackGateState() {
        try {
          const res = await fetch('/audio/test', { cache: 'no-store' });
          if (!res.ok) throw new Error(`status ${res.status}`);
          const data = await res.json();
          let reason = '';
          if (data && data.sweep_running) {
            reason = 'Sweep is currently running';
          } else if (data && data.running) {
            reason = 'Audio test tone is currently running';
          }
          setPlaybackBlockedReason(reason);
        } catch (e) {
          console.warn('Failed to refresh audio playback gate state', e);
        }
      }

      async function stopRemotePlayback() {
        if (!playingRowId) return;
        try {
          await fetch('/audio/playback?action=stop', { method: 'POST' });
        } catch (_) {
          // ignore
        }
        markPlaying(null);
      }

      async function startPlayback(row) {
        if (!row) return;
        if (playbackBlockedReason) {
          alert(`Playback unavailable: ${playbackBlockedReason}`);
          return;
        }
        const name = row.dataset.fileName;
        if (!name) return;
        if (!name.toLowerCase().endsWith('.mp3')) {
          alert('Device playback currently supports .mp3 files only.');
          return;
        }

        const params = new URLSearchParams();
        params.set('action', 'start');
        params.set('name', name);

        try {
          const res = await fetch(`/audio/playback?${params.toString()}`, { method: 'POST' });
          if (!res.ok) {
            let reason = '';
            try { reason = (await res.text()).trim(); } catch (_) {}
            throw new Error(reason || 'Playback failed');
          }
          markPlaying(row);
        } catch (err) {
          alert(err?.message || 'Playback failed');
          markPlaying(null);
        }
      }

      async function uploadFile(file) {
        if (!file) return;
        if (uploadInFlight) return;
        if (!hasAllowedAudioExt(file.name || '')) {
          alert(`Only audio files are allowed (${allowedAudioText})`);
          return;
        }

        // server expects raw filename (not encodeURIComponent) because it treats URI as-is;
        // keep it consistent with how links are rendered by the server.
        const uploadPath = safeBase + file.name;
        uploadInFlight = true;
        setUploadOverlay(true, `Uploading ${file.name}...`);

        try {
          const res = await fetch(uploadPath, { method: 'POST', body: file });
          if (!res.ok) {
            let reason = '';
            try { reason = (await res.text()).trim(); } catch (_) { reason = ''; }
            const status = res.status ? `${res.status} ` : '';
            const statusText = res.statusText || '';
            const message = reason || (statusText ? `${status}${statusText}` : `${status}Upload failed`);
            throw new Error(message.trim());
          }
          window.location.reload();
        } catch (err) {
          alert(err.message || 'Upload failed');
        } finally {
          uploadInFlight = false;
          setUploadOverlay(false);
          if (fileInput) {
            fileInput.value = '';
          }
        }
      }

      if (dropzone && fileInput) {
        dropzone.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('dragover', (e) => {
          e.preventDefault();
          dropzone.classList.add('dragover');
        });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
        dropzone.addEventListener('drop', (e) => {
          e.preventDefault();
          dropzone.classList.remove('dragover');
          const file = e.dataTransfer.files && e.dataTransfer.files[0];
          uploadFile(file);
        });
      }

      fileInput?.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0];
        uploadFile(file);
      });

      const mobileUpload = document.getElementById('mobile-upload');
      mobileUpload?.addEventListener('click', () => fileInput?.click());

      // -------- dropdown logic --------
      function closeAll(exceptId) {
        document.querySelectorAll('.details').forEach(d => {
          if (d.dataset.forRow !== exceptId) d.classList.remove('open');
        });
        document.querySelectorAll('.chev').forEach(b => {
          if (b.dataset.rowId !== exceptId) b.dataset.open = "0";
        });
        document.querySelectorAll('.file-item').forEach(row => {
          if (row.id !== exceptId) {
            row.classList.remove('open');
            row.classList.remove('editing');
          }
        });
      }

      async function persistMeta(fileUri, meta) {
        // fileUri is like "/sounds/foo.mp3"
        const metaUri = '/sounds/file-meta' + fileUri.slice('/sounds'.length);
        const res = await fetch(metaUri, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(meta),
        });
        if (!res.ok) throw new Error('Meta update failed: ' + res.status);
      }

      const debounceTimers = new Map();
      function schedulePersist(rowId, fileUri, getMetaFn) {
        const key = rowId;
        if (debounceTimers.has(key)) clearTimeout(debounceTimers.get(key));
        debounceTimers.set(key, setTimeout(async () => {
          try {
            await persistMeta(fileUri, getMetaFn());
          } catch (e) {
            alert(e.message || String(e));
          }
        }, 200));
      }

      document.querySelectorAll('.chev').forEach(btn => {
        btn.addEventListener('click', () => {
          const rowId = btn.dataset.rowId;
          const details = document.querySelector(`.details[data-for-row="${rowId}"]`);
          const row = document.getElementById(rowId);
          const isProtected = row?.dataset.protected === '1';
          const isOpen = btn.dataset.open === "1";
          closeAll(rowId);
          if (!isOpen) {
            btn.dataset.open = "1";
            details?.classList.add('open');
            if (row) {
              row.classList.add('open');
              if (!isProtected) {
                row.classList.add('editing');
                const nameInput = row.querySelector('input[data-k="name-edit"]');
                if (nameInput) {
                  const currentName = (row.querySelector('.file-name')?.textContent || '').trim();
                  nameInput.value = splitNameExt(currentName).base || currentName;
                  nameInput.focus();
                  nameInput.select();
                }
              }
            }
          } else {
            btn.dataset.open = "0";
            details?.classList.remove('open');
            if (row) {
              row.classList.remove('open');
              row.classList.remove('editing');
            }
          }
        });
      });

      document.querySelectorAll('button[data-k="play"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const row = btn.closest('.file-item');
          startPlayback(row);
        });
      });

      document.querySelectorAll('.details').forEach(details => {
        const rowId = details.dataset.forRow;
        const row = document.getElementById(rowId);
        if (!row) return;

        let fileUri = row.dataset.fileUri; // "/sounds/<name>"
        const isProtected = row.dataset.protected === '1';
        const toggle = row.querySelector('input[data-k="enabled-toggle"]');
        const prob = details.querySelector('input[data-k="probability"]');
        const probNum = details.querySelector('input[data-k="probability-num"]');
        const probMinus = details.querySelector('button[data-k="probability-minus"]');
        const probPlus = details.querySelector('button[data-k="probability-plus"]');
        const vol  = details.querySelector('input[data-k="volume"]');
        const volNum = details.querySelector('input[data-k="volume-num"]');
        const volMinus = details.querySelector('button[data-k="volume-minus"]');
        const volPlus = details.querySelector('button[data-k="volume-plus"]');
        const deleteBtn = details.querySelector('button.delete-btn');
        const nameInput = row.querySelector('input[data-k="name-edit"]');
        const nameLink = row.querySelector('.file-name');
        let nameExt = splitNameExt(row.dataset.fileName || nameLink?.textContent || '').ext || '.mp3';
        let renameInFlight = false;
        let pendingRenameRaw = null;

        if (isProtected) {
          if (nameInput) {
            nameInput.disabled = true;
          }
          if (deleteBtn) {
            deleteBtn.disabled = true;
          }
        }

        const clampProbability = (v) => Math.min(FILE_PROBABILITY_MAX, Math.max(0, parseInt(v || 0, 10)));
        const clampVolume = (v) => Math.min(FILE_VOLUME_MAX, Math.max(0, parseInt(v || 0, 10)));

        function setProb(val) {
          const v = clampProbability(val);
          if (prob) prob.value = v;
          if (probNum) probNum.value = v;
          row.dataset.probability = String(v);
          refreshSoundStateNote();
        }
        function setVol(val) {
          const v = clampVolume(val);
          if (vol) vol.value = v;
          if (volNum) volNum.value = v;
          row.dataset.volume = String(v);
          refreshSoundStateNote();
        }

        // init from server-rendered dataset
        setProb(row.dataset.probability || "50");
        setVol(row.dataset.volume || "50");
        if (toggle) toggle.checked = (row.dataset.enabled === "1");

        function currentMeta() {
          return {
            probability: clampProbability(prob?.value),
            volume: clampVolume(vol?.value),
            enabled: !!(toggle && toggle.checked)
          };
        }

        function handleSliderOrNudgeChange(kind, setter, delta) {
          return () => {
            const cur = kind === 'prob'
              ? clampProbability(prob?.value)
              : clampVolume(vol?.value);
            const next = delta ? cur + delta : cur;
            setter(next);
            schedulePersist(rowId, fileUri, currentMeta);
          };
        }

        function commitProbFromNumber() {
          if (!probNum) return;
          const raw = String(probNum.value ?? '').trim();
          if (raw === '') {
            // Revert blank/invalid edit to current slider value; no persist.
            setProb(prob?.value);
            return;
          }
          const parsed = Number.parseInt(raw, 10);
          if (Number.isNaN(parsed)) {
            setProb(prob?.value);
            return;
          }
          const clamped = clampProbability(parsed);
          setProb(clamped);
          // Commit on blur/change/enter even if slider was already mirrored during typing.
          schedulePersist(rowId, fileUri, currentMeta);
        }

        function commitVolFromNumber() {
          if (!volNum) return;
          const raw = String(volNum.value ?? '').trim();
          if (raw === '') {
            // Revert blank/invalid edit to current slider value; no persist.
            setVol(vol?.value);
            return;
          }
          const parsed = Number.parseInt(raw, 10);
          if (Number.isNaN(parsed)) {
            setVol(vol?.value);
            return;
          }
          const clamped = clampVolume(parsed);
          setVol(clamped);
          // Commit on blur/change/enter even if slider was already mirrored during typing.
          schedulePersist(rowId, fileUri, currentMeta);
        }

        prob?.addEventListener('input', handleSliderOrNudgeChange('prob', setProb));
        probMinus?.addEventListener('click', handleSliderOrNudgeChange('prob', setProb, -1));
        probPlus?.addEventListener('click', handleSliderOrNudgeChange('prob', setProb, 1));

        vol?.addEventListener('input', handleSliderOrNudgeChange('vol', setVol));
        volMinus?.addEventListener('click', handleSliderOrNudgeChange('vol', setVol, -1));
        volPlus?.addEventListener('click', handleSliderOrNudgeChange('vol', setVol, 1));

        probNum?.addEventListener('input', () => {
          const raw = String(probNum.value ?? '').trim();
          if (raw === '') return;
          const parsed = Number.parseInt(raw, 10);
          if (Number.isNaN(parsed)) return;
          if (parsed >= 0 && parsed <= FILE_PROBABILITY_MAX && prob) {
            prob.value = parsed;
          }
        });
        probNum?.addEventListener('blur', commitProbFromNumber);
        probNum?.addEventListener('change', commitProbFromNumber);
        probNum?.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            commitProbFromNumber();
            probNum.blur();
          }
        });

        volNum?.addEventListener('input', () => {
          const raw = String(volNum.value ?? '').trim();
          if (raw === '') return;
          const parsed = Number.parseInt(raw, 10);
          if (Number.isNaN(parsed)) return;
          if (parsed >= 0 && parsed <= FILE_VOLUME_MAX && vol) {
            vol.value = parsed;
          }
        });
        volNum?.addEventListener('blur', commitVolFromNumber);
        volNum?.addEventListener('change', commitVolFromNumber);
        volNum?.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            commitVolFromNumber();
            volNum.blur();
          }
        });

        toggle?.addEventListener('change', () => {
          row.dataset.enabled = toggle.checked ? '1' : '0';
          refreshSoundStateNote();
          schedulePersist(rowId, fileUri, currentMeta);
        });

        if (deleteBtn) {
          deleteBtn.addEventListener('click', async () => {
            if (isProtected || deleteBtn.disabled) return;
            if (!confirm('Delete this file?')) return;
            if (playingRowId === rowId) {
              await stopRemotePlayback();
            }
            try {
              const res = await fetch(fileUri + '?delete=1', { method: 'GET' });
              if (!res.ok) throw new Error('Delete failed: ' + res.status);
              window.location.reload();
            } catch (err) {
              alert(err.message || String(err));
            }
          });
        }

        function updateFileUri(newName) {
          // keep URLs consistent with server-side behavior: no encodeURIComponent here
          fileUri = safeBase + newName;
          row.dataset.fileUri = fileUri;
          row.dataset.fileName = newName;
          nameExt = splitNameExt(newName).ext || nameExt;
          if (nameLink) {
            nameLink.href = fileUri;
            nameLink.textContent = newName;
            nameLink.title = newName;
          }
        }

        async function renameFile(newBaseName) {
          if (isProtected || (nameInput && nameInput.disabled)) {
            return;
          }
          const raw = (newBaseName || '').trim();
          if (!raw) return;

          const baseOnly = raw;
          if (!baseOnly) return;

          const targetName = baseOnly + nameExt;
          const currentName = String(row.dataset.fileName || nameLink?.textContent || '').trim();
          if (targetName === currentName) return;
          if (targetName.includes('/') || targetName.includes('\\')) {
            alert('File name cannot contain slashes.');
            return;
          }
          if (!hasAllowedAudioExt(targetName)) {
            alert(`Only audio files are allowed (${allowedAudioText})`);
            return;
          }

          if (renameInFlight) {
            pendingRenameRaw = raw;
            return;
          }

          renameInFlight = true;
          if (nameInput) {
            nameInput.disabled = true;
          }
          try {
            const res = await fetch(fileUri + '?rename=' + encodeURIComponent(baseOnly), { method: 'GET' });
            if (!res.ok) throw new Error('Rename failed: ' + res.status);
            updateFileUri(targetName);
            if (nameInput) {
              nameInput.value = baseOnly;
            }
          } catch (err) {
            alert(err.message || String(err));
          } finally {
            renameInFlight = false;
            if (nameInput) {
              nameInput.disabled = false;
            }
            const queued = pendingRenameRaw;
            pendingRenameRaw = null;
            if (queued && queued !== raw) {
              renameFile(queued);
            }
          }
        }

        if (nameInput) {
          nameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              if (e.repeat) return;
              e.preventDefault();
              renameFile(nameInput.value);
            } else if (e.key === 'Escape') {
              row.classList.remove('editing');
            }
          });
          nameInput.addEventListener('blur', () => {
            renameFile(nameInput.value);
          });
        }
      });

      refreshSoundStateNote();
      refreshPlaybackGateState();
      refreshSilentPlaybackNote();
      window.setInterval(refreshPlaybackGateState, 1000);
      window.setInterval(refreshSilentPlaybackNote, 3000);
      document.documentElement.dataset.pageReady = '1';
    });
  </script>
</head>

<body>
  <div id="navbar"></div>

  <div class="content">
    <div class="title-row">
      <h1>Coinbox Sounds</h1>
      <button id="mobile-upload" class="mobile-upload" aria-label="Upload a file">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 4a1 1 0 0 1 .7.3l3.5 3.6a.7.7 0 0 1-.5 1.2H13v6.9a1 1 0 0 1-2 0V9.1H8.3a.7.7 0 0 1-.5-1.2l3.5-3.6A1 1 0 0 1 12 4Zm-7 12.5a1 1 0 0 1 1 1v1h12v-1a1 1 0 1 1 2 0v1.5c0 .83-.67 1.5-1.5 1.5h-13c-.83 0-1.5-.67-1.5-1.5v-1.5a1 1 0 0 1 1-1Z"/>
        </svg>
      </button>
    </div>

    <div id="dropzone" class="dropzone">
      Drag &amp; drop an audio file here or click to upload
    </div>

    <input id="newfile" type="file" hidden accept=".mp3,audio/mpeg">
    <p id="playback-lock-note" class="playback-lock-note" hidden></p>
    <p id="playback-silent-note" class="playback-lock-note warning" hidden></p>
    <p id="playback-sound-state-note" class="playback-lock-note warning" hidden></p>

    <div id="file-list" class="file-list">
      <!-- rows injected by server (mainapp.c) -->
