<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coinbox Home</title>
  <style>
    :root {
      --text: #0f172a;
      --muted: #475569;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: var(--text);
      line-height: 1.5;
    }
    .content {
      padding: clamp(1rem, 2vw + 0.5rem, 2.25rem);
      text-align: center;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      font-size: clamp(1.7rem, 1vw + 1.4rem, 2.3rem);
      margin-bottom: 0.5em;
    }
    p {
      color: var(--muted);
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <div id="navbar"></div>
  <script src="/navbar.js"></script>

  <div class="content">
    <h1>Welcome to your Coinbox</h1>
    <p>Use the navigation above to explore the File Server or Maintenance pages.</p>
  </div>
</body>
</html>
