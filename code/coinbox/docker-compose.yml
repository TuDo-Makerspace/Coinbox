version: "3.9"

services:
  fileserver-mock:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && node mock_server.js"
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    volumes:
      - .:/app
      - node_modules_cache:/app/node_modules

volumes:
  node_modules_cache:
